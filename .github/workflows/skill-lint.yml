name: skill-lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài thư viện cho eval (openpyxl)
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Skill Doctor (0 FAIL / 0 WARN)
        env:
          PYTHONUTF8: "1"
        run: |
          python -I skills/x6-skill-doctor/scripts/skill_doctor.py skills | tee doctor.txt
          if grep -Eq "[1-9][0-9]* FAIL|[1-9][0-9]* WARN" doctor.txt; then
            echo "::error::skill_doctor còn FAIL/WARN"
            exit 1
          fi

      - name: Eval harness
        env:
          PYTHONUTF8: "1"
        run: python skills/evals/run_evals.py skills

      - name: Biên dịch mọi script Python
        env:
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          bad = 0
          for p in sorted(Path(".").rglob("*.py")):
              if any(part in {"node_modules", ".git", "claude-mem", "ui-ux-pro-max"} for part in p.parts):
                  continue
              try:
                  compile(p.read_text(encoding="utf-8"), str(p), "exec")
              except SyntaxError as e:
                  bad += 1
                  print(f"::error file={p}::{e}")
          sys.exit(1 if bad else 0)
          PY
